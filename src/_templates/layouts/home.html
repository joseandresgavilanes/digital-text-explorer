---
layout: 'base'
---

{% include "components/headers/home.html" %}

<div class="container mx-auto px-5 pt-12 pb-24">
  <div
    class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-12 xl:grid-cols-4"
  >
    {% for card in cards %}
    <!-- <div class=""> -->
    <a href="{{ card.link }}">
      <div class="w-full transition duration-250 ease-in-out hover:scale-105">
        <img
          class="mb-6 h-32 w-full rounded-2xl object-cover object-center shadow lg:h-48"
          src="{{ card.img | default: '/static/flowers.jpg' }}"
          alt=""
        />
        <p
          class="text-accent-light title-font text-sm font-medium tracking-widest uppercase"
        >
          {{ card.eyebrow }}
        </p>
        <h2
          class="text-text-dark my-2 text-xl leading-tight font-bold sm:text-2xl"
        >
          {{ card.label }}
        </h2>
      </div>
    </a>
    <!-- </div> -->
    {% endfor %}
  </div>
</div>
