<header class="bg-neutral-dark py-18 shadow-lg">
  <div class="container mx-auto px-5">
    <div
      class="flex min-h-24 w-full flex-wrap items-start justify-between gap-12 md:flex-nowrap"
    >
      <div class="basis-full md:basis-1/3">
        <h3
          class="text-accent-light title-font mb-1 text-xs font-medium tracking-widest uppercase"
        >
          {{ section }}
        </h3>
        <h1
          class="title-font text-text-dark mb-2 text-2xl font-bold sm:text-4xl"
        >
          {{ title }}
        </h1>
        <div class="bg-accent-light mt-4 h-1 w-20 rounded"></div>
      </div>
      <div class="basis-full md:basis-2/3">
        <p
          class="text-text-light mb-2 max-w-[50ch] text-xl font-light sm:text-2xl"
        >
          {{ description }}
        </p>
      </div>
    </div>
  </div>
</header>
