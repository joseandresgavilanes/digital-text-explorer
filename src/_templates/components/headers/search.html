<header class="bg-neutral-dark py-18 shadow-lg">

    <div
      class="flex min-h-24 w-full flex-wrap items-baseline-last justify-between gap-6 md:flex-nowrap"
    >
      <div class="basis-full sm:pr-4 md:basis-1/3 lg:pr-12 xl:basis-1/4">
        <h3
          class="text-accent-light title-font mb-1 text-xs font-medium tracking-widest uppercase"
        >
          {{ section }}
        </h3>
        <h1
          class="title-font text-text-dark mb-2 text-2xl font-bold sm:text-4xl"
        >
          {{ title }}
        </h1>
        <div class="bg-accent-light mt-4 h-1 w-20 rounded"></div>
      </div>
      <div class="basis-full md:basis-2/3 xl:basis-3/4">
        {% include "components/searchbar.html" %}
      </div>
    </div>
  </div>
</header>
